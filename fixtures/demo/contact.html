<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FormPilot demo form</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #172033;
        background:
          radial-gradient(circle at 15% 10%, rgba(55, 116, 255, 0.18), transparent 32rem),
          linear-gradient(145deg, #f7f9ff 0%, #eef3ff 48%, #f8fafc 100%);
      }
      .shell { width: min(1080px, calc(100% - 64px)); margin: 0 auto; padding: 48px 0 80px; }
      .eyebrow { color: #3157ca; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
      h1 { max-width: 680px; margin: 10px 0 12px; font-size: clamp(38px, 6vw, 64px); line-height: .98; letter-spacing: -.045em; }
      .intro { max-width: 580px; margin: 0 0 32px; color: #5b667c; font-size: 17px; line-height: 1.6; }
      form { width: min(690px, 100%); padding: 26px; border: 1px solid rgba(112, 130, 170, .2); border-radius: 22px; background: rgba(255, 255, 255, .84); box-shadow: 0 24px 80px rgba(66, 85, 130, .14); backdrop-filter: blur(24px); }
      .form-head { display: flex; justify-content: space-between; gap: 20px; align-items: start; margin-bottom: 24px; }
      h2 { margin: 0 0 6px; font-size: 23px; letter-spacing: -.025em; }
      .form-head p { margin: 0; color: #6c7588; }
      .step { flex: none; padding: 7px 10px; color: #3157ca; border: 1px solid #cad6ff; border-radius: 999px; background: #eff3ff; font-size: 12px; font-weight: 750; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
      label { display: grid; gap: 7px; color: #3b465c; font-size: 13px; font-weight: 700; }
      label.full { grid-column: 1 / -1; }
      input, select, textarea { width: 100%; border: 1px solid #d5dbea; border-radius: 11px; background: #fff; color: #172033; font: inherit; padding: 12px 13px; outline: none; }
      input:focus, select:focus, textarea:focus { border-color: #5276df; box-shadow: 0 0 0 3px rgba(82, 118, 223, .13); }
      textarea { min-height: 96px; resize: vertical; }
      .actions { display: flex; justify-content: flex-end; margin-top: 22px; }
      .actions button { border: 0; border-radius: 11px; padding: 12px 18px; color: #fff; background: #172033; font: inherit; font-weight: 800; }
      @media (max-width: 700px) { .shell { width: min(100% - 28px, 1080px); padding-top: 28px; } .grid { grid-template-columns: 1fr; } label.full { grid-column: auto; } }
    </style>
  </head>
  <body>
    <main class="shell">
      <div class="eyebrow">Northstar Studio</div>
      <h1>Tell us about your next project.</h1>
      <p class="intro">A safe demo form for testing FormPilot. Preview every mapped field before anything is written.</p>
      <form aria-label="Project inquiry">
        <div class="form-head">
          <div>
            <h2>Project inquiry</h2>
            <p>We usually reply within two business days.</p>
          </div>
          <span class="step">Step 1 of 1</span>
        </div>
        <div class="grid">
          <label>First name<input name="first_name" autocomplete="given-name"></label>
          <label>Last name<input name="last_name" autocomplete="family-name"></label>
          <label>Email<input name="email" type="email" autocomplete="email"></label>
          <label>Phone<input name="phone" type="tel" autocomplete="tel"></label>
          <label>Company<input name="company" autocomplete="organization"></label>
          <label>Country<select name="country" autocomplete="country"><option value="">Choose a country</option><option value="US">United States</option><option value="KR">South Korea</option><option value="DE">Germany</option></select></label>
          <label class="full">Project notes<textarea name="project_notes" placeholder="What are you building?"></textarea></label>
        </div>
        <div class="actions"><button type="button">Continue</button></div>
      </form>
    </main>
  </body>
</html>
